<section class="px-5 pb-20 sm:px-8 sm:pb-28" aria-labelledby="cta-final">
  <div class="relative isolate mx-auto max-w-6xl overflow-hidden rounded-[36px] bg-accent px-6 py-16 text-center text-[#151515] sm:px-12 sm:py-24">
    <div class="absolute inset-0 -z-10 text-[#151515]/[0.09]">{{> topo}}</div>
    <p class="text-xs font-black uppercase tracking-[0.18em] text-[#151515]/70">Gratis · Sin cuenta · Sin anuncios</p>
    <h2 id="cta-final" class="mx-auto mt-4 max-w-3xl text-4xl font-black leading-[1.03] tracking-tighter text-balance sm:text-6xl">
      Tu próxima ruta empieza con un toque.
    </h2>
    <p class="mx-auto mt-5 max-w-xl text-lg font-medium text-[#151515]/75 text-pretty">
      Abre Trackingfy, concede el permiso de ubicación y empieza a grabar. Tu historial se queda contigo.
    </p>
    <div class="mt-9 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a href="{{appPath}}" class="btn btn-dark btn-lg">Empezar a grabar gratis {{icon arrow-right}}</a>
      <a href="{{releasesUrl}}" data-apk class="btn btn-lg border-2 border-[#151515]/80 hover:bg-[#151515]/5 ios:hidden">
        {{icon download}} Descargar APK para Android
      </a>
    </div>
  </div>
</section>
