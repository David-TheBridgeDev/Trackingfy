<!doctype html>
<!--
  Source of site/media/og-image.png, the 1200×630 preview shown when a page is shared.
  Regenerate it with a Chromium-based browser in headless mode, for example:
    msedge --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=site/media/og-image.png site/og/og-image.html
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0d0d0e;
        color: #fff;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
      .glow.a { width: 620px; height: 620px; right: -120px; top: -260px; background: rgba(239, 188, 33, 0.28); }
      .glow.b { width: 420px; height: 420px; left: -160px; bottom: -220px; background: rgba(249, 115, 22, 0.14); }
      .topo { position: absolute; inset: 0; color: rgba(255, 255, 255, 0.06); }
      .content { position: absolute; left: 80px; top: 72px; width: 640px; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand span { font-size: 34px; font-weight: 900; letter-spacing: -0.06em; text-transform: uppercase; }
      h1 { margin-top: 56px; font-size: 76px; line-height: 0.98; font-weight: 900; letter-spacing: -0.055em; }
      h1 em { font-style: normal; color: #efbc21; }
      .chips { display: flex; gap: 12px; margin-top: 44px; }
      .chip { padding: 12px 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); font-size: 22px; font-weight: 700; }
      .url { position: absolute; left: 80px; bottom: 56px; font-size: 22px; font-weight: 700; color: rgba(255, 255, 255, 0.55); }
      .phone { position: absolute; right: 96px; top: 70px; width: 300px; height: 620px; border-radius: 48px; background: #1b1b1e; padding: 12px; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6); border: 1px solid #2e2e33; }
      .screen { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #f2efe9; }
      .pill { position: absolute; left: 12px; right: 12px; top: 22px; height: 48px; border-radius: 999px; background: rgba(255, 255, 255, 0.96); display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: -0.06em; text-transform: uppercase; color: #efbc21; font-size: 22px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12); }
      .stats { position: absolute; left: 12px; right: 12px; top: 330px; border-radius: 18px; background: rgba(255, 255, 255, 0.94); display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 6px; text-align: center; box-shadow: 0 16px 30px rgba(0, 0, 0, 0.15); }
      .stats p { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #777; }
      .stats b { display: block; margin-top: 2px; font-size: 17px; font-weight: 900; color: #444; }
    </style>
  </head>
  <body>
