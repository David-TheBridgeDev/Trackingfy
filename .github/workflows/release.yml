name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Se ejecuta cuando subes un tag como v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para crear la Release en GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Para Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Dependencias
        run: npm ci

      - name: Configurar Keystore de Android
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -d > android/app/trackingfy.keystore
          echo "$KEYSTORE_PROPERTIES" > android/keystore.properties

      - name: Compilar App Web y Sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK (Release) con Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          sed -i '/org.gradle.java.home/d' ./gradle.properties
          ./gradlew assembleRelease

      - name: Renombrar APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk Trackingfy.apk

      - name: Crear Release y Subir APK
        uses: softprops/action-gh-release@v2
        with:
          files: Trackingfy.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
